# Weighted cascade: choose one forwarder per level, in numeric order.
# Only main forwarders support cascade. Every forwarder needs a positive level.
verbose=True
listen=:8443

# Relative weights, not percentages. Weight 0 excludes a forwarder.
# Priority selects the highest enabled, positive-weight priority first.
forward=socks5://proxy1:1080#cascade=1&weight=20&retries=1&retrydelay=100
forward=socks5://proxy2:1080#cascade=1&weight=80&retries=2&retrydelay=200
forward=socks5://proxy3:1080#cascade=2&weight=30&retries=3&retrydelay=300
forward=socks5://proxy4:1080#cascade=2&weight=70&retries=4&retrydelay=400

# Each block selects a forwarder by weight, with one try plus its retries.
# retries and retrydelay override forwarders; attempts and attemptdelay set blocks.
# Per-field priority: specific cascade > global > forwarder, regardless of order.
# Cascades advance independently. The longest required pause applies.
# These limits do not impose an overall time limit on protocol handshakes.
cascade=attempts=6&attemptdelay=100
cascade=cascade=1&retries=6&retrydelay=100
cascade=cascade=2&retrydelay=100

# prs requires all active levels; failure never falls back to direct.
# pr skips unavailable levels and tries direct if all complete chains fail.
# Entirely zero-weight levels are absent in both modes.
strategy=prs

# Checks test individual forwarders, not all paths through the cascade.
# check=disable enables all forwarders immediately. Single-forwarder levels
# are also enabled without checks. Enabled is not proof of path health.
check=http://www.msftconnecttest.com/connecttest.txt#expect=200
checkinterval=30

# Only the first selected hop uses its local #interface= option.
# No partial-chain target probes are made. UDP setup cannot prove delivery.
